[package]
name = "viewset"
version = "0.4.4"
edition = "2024"
description = "A Rust, Actix Web–based resource framework that provides convention-driven CRUD APIs over database entities, with layered ViewSet → Service → Repository architecture, validation/hooks, pagination, filtering, transactions, and caching."
license = "MIT"

[dependencies]
actix-web = "4.14.1"
actixutils = "0.7"
async-trait = "0.1.92"
chrono = "0.4.45"
moka = { version = "0.12.16", features = ["sync"] }
rust_decimal = "1.42.1"
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9", features = ["postgres",  "uuid","chrono","rust_decimal"] }
thiserror = "2.0.20"
tracing = "0.1.44"
uuid = "1.24.0"
viewset-macros = "0.2"
ferrumec = "0.3"
